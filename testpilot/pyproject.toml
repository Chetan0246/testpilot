[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot"
version = "0.1.0"
description = "An agent that writes, runs and repairs pytest suites with NVIDIA Nemotron on Nebius Token Factory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pytest>=8", "pytest-cov>=5"]

[project.optional-dependencies]
demo = ["streamlit>=1.35"]

[project.scripts]
testpilot = "testpilot.cli:main"

[tool.setuptools]
packages = ["testpilot"]
